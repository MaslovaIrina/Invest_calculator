<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Real Estate Calculator (FastAPI demo)</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    label { display:block; margin-top: 12px; }
    input { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 14px; cursor: pointer; }
    .card { margin-top: 20px; padding: 14px; border: 1px solid #ddd; border-radius: 10px; }
    .row { display:flex; gap: 16px; flex-wrap: wrap; }
    .metric { flex: 1 1 200px; padding: 10px; border: 1px solid #eee; border-radius: 10px; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <h1>Калькулятор инвестиций (демо FastAPI)</h1>

  <div class="card">
    <h3>Пополнения</h3>
    <label>Денег для ипотеки или депозита уже отложено (all_free_money)
      <input id="all_free_money" type="number" step="1000" value="25000">
    </label>
    <label>Денег для ипотеки или депозита в месяц (monthly_free_money)
      <input id="monthly_free_money" type="number" step="1000" value="25000">
    </label>
    <label>Непредвиденные расходы в месяц (monthly_unexpected_expenses)
      <input id="monthly_unexpected_expenses" type="number" step="1000" value="5000">
    </label>
  </div>

  <div class="card">
    <h3>Приобретение объекта</h3>
    <label>Цена объекта (purchase_price)
      <input id="purchase_price" type="number" step="500000" value="15000000">
    </label>
    <label> Ожидаемое изменение стомости недвижимости в год (в процентах) (yearly_apart_price_change)
      <input id="yearly_apart_price_change" type="number" step="0.2" value="7">
    </label>
    <label>Есть ипотека?
      <select id="has_mortgage">
        <option value="no" selected>нет</option>
        <option value="yes">да</option>
      </select>
    </label>

    <div id="mortgage_block" style="display:none; margin-top:12px;">
      <label>Срок ипотеки (mortgage_term)
        <input id="mortgage_term" type="number" step="1" value="">
      </label>
      <label>Процент по ипотеке, годовой (ipotek_percent)
        <input id="ipotek_percent" type="number" step="1" value="">
      </label>
    </div>


  </div>

  <div class="card">
    <h3>Накопления</h3>
    <label>Аренда в месяц (monthly_rent)
      <input id="monthly_rent" type="number" step="10" value="1200">
    </label>
    <label>Удорожание аренды в год (в процентах) (yearly_rent_increase)
      <input id="yearly_rent_increase" type="number" step="1" value="2">
    </label>
    <label>Процентов годовых на вкладе (invest_percent)
      <input id="invest_percent" type="number" step="0.2" value="12">
    </label>
  </div>

  <button id="btn">Calculate</button>
    <div id="status" class="err" style="margin-top:10px;"></div>

  <div class="card">
    <h2>Результат</h2>
    <div class="row">
      <div class="metric">
        <div><b>Monthly cashflow</b></div>
        <div id="m_cf">—</div>
      </div>
      <div class="metric">
        <div><b>Yearly cashflow</b></div>
        <div id="y_cf">—</div>
      </div>
      <div class="metric">
        <div><b>Gross yield</b></div>
        <div id="gy">—</div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8000/api/calc";

    const el = (id) => document.getElementById(id);

    async function calculate() {
      el("status").textContent = "";

      const payload = {
        purchase_price: Number(el("purchase_price").value),
        monthly_rent: Number(el("monthly_rent").value),
        yearly_rent_increase: Number(el("yearly_rent_increase").value),
        monthly_free_money: Number(el("monthly_free_money").value),
        all_free_money: Number(el("all_free_money").value),
        invest_percent: Number(el("invest_percent").value),
        yearly_apart_price_change: Number(el("yearly_apart_price_change").value),
        monthly_unexpected_expenses: Number(el("monthly_unexpected_expenses").value),
        has_mortgage: el("has_mortgage").value === "yes",
        mortgage_term: el("has_mortgage").value === "yes" ? Number(el("mortgage_term").value) : null,
        ipotek_percent: el("has_mortgage").value === "yes" ? Number(el("ipotek_percent").value) : null,
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(`API error ${res.status}: ${text}`);
        }

        const data = await res.json();

        el("m_cf").textContent = data.monthly_cashflow.toFixed(2);
        el("y_cf").textContent = data.yearly_cashflow.toFixed(2);
        el("gy").textContent = data.gross_yield_percent.toFixed(2) + " %";
      } catch (e) {
        el("status").textContent =
          "Ошибка запроса. Проверь, что FastAPI запущен на 127.0.0.1:8000. " +
          "Текст: " + e.message;
      }
    }
    function toggleMortgageBlock() {
      const yes = el("has_mortgage").value === "yes";
      el("mortgage_block").style.display = yes ? "block" : "none";
      }

    el("has_mortgage").addEventListener("change", toggleMortgageBlock);
    toggleMortgageBlock(); // вызвать один раз при загрузке

    el("btn").addEventListener("click", calculate);
  </script>
</body>
</html>
