<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Investment Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #fafafa; }
    .page { max-width: 1800px; margin: 0 auto; padding: 24px 16px; }
    h1 { margin: 0 0 16px; }

    .layout { display: grid; grid-template-columns: 560px 1fr; gap: 16px; align-items: start; }
    @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

    .card { background:#fff; padding:14px; border:1px solid #ddd; border-radius:10px; margin-bottom:12px; }

    label { display:block; margin-top: 12px; font-size: 14px; }
    input, select { width:100%; padding:10px; margin-top:6px; box-sizing:border-box; border:1px solid #ccc; border-radius:8px; }

    button { width:100%; margin-top:16px; padding:12px 14px; border:0; border-radius:10px; cursor:pointer; background:#111; color:#fff; font-weight:600; }
    button:hover { opacity: 0.92; }

    .err { color:#b00020; margin-top:10px; }

    .row { display:flex; gap:12px; flex-wrap:wrap; }
    .metric { flex:1 1 220px; padding:10px; border:1px solid #eee; border-radius:10px; background:#fff; }
    .metric b { display:block; margin-bottom:6px; }

    .placeholder { padding:18px; border:1px dashed #ddd; border-radius:10px; background:#fff; color:#555; }

    details { border:1px solid #eee; border-radius:10px; padding:10px 12px; background:#fff; }
    details + details { margin-top: 10px; }
    summary { cursor:pointer; font-weight:700; list-style:none; }
    summary::-webkit-details-marker { display:none; }

    .tableWrap { margin-top:10px; max-height:420px; overflow:auto; border:1px solid #eee; border-radius:10px; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:8px; border-bottom:1px solid #f0f0f0; text-align:left; }
    th { border-bottom:1px solid #ddd; position:sticky; top:0; background:#fff; }

    .small { font-size:12px; opacity:0.8; margin-top:6px; }

    @media (min-width: 981px) {
      .leftColumn { position: sticky; top: 16px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Инвестиции: депозит vs недвижимость</h1>

    <div class="layout">
      <!-- LEFT -->
      <div class="leftColumn">
        <div class="card">
          <h2 style="margin:0 0 12px;">Параметры</h2>

          <label>Срок расчета, лет (years_of_calculation)
            <input id="years_of_calculation" type="number" step="1" value="10">
          </label>

          <label>Начальный капитал (all_free_money)
            <input id="all_free_money" type="number" step="500000" value="10000000">
          </label>

          <label>Ставка депозита, % годовых (invest_percent)
            <input id="invest_percent" type="number" step="0.5" value="10">
          </label>

          <label>Пополнение депозита (deposit_refill)
            <select id="deposit_mode">
              <option value="none" selected>нет</option>
              <option value="every_month">каждый месяц</option>
              <option value="every_year">каждый год</option>
            </select>
          </label>

          <div id="deposit_common" style="display:none; margin-top:12px;">
            <label>Сумма пополнения (deposit_refill_amount)
              <input id="deposit_refill_amount" type="number" step="1000" value="50000">
            </label>
          </div>

          <hr style="border:none; border-top:1px solid #eee; margin:14px 0;">

          <div style="font-weight:700;">Покупка</div>

          <label>Цена объекта (purchase_price)
            <input id="purchase_price" type="number" step="500000" value="15000000">
          </label>

          <label>Рост цены в год, % (yearly_apart_price_change)
            <input id="yearly_apart_price_change" type="number" step="0.2" value="5">
          </label>

          <label>Является ли вложением в новостройку?
            <select id="new_building_mode">
              <option value="none" selected>нет</option>
              <option value="yes">да</option>
            </select>
          </label>

          <div id="new_building_common" style="display:none; margin-top:12px;">
            <label>Через сколько лет сдача (year_new_building_ready)
              <input id="year_new_building_ready" type="number" step="1" value="3">
            </label>

            <label>Ожидаемое подорожание новостройки после сдачи, % (new_building_price_change)
              <input id="new_building_price_change" type="number" step="1" value="30">
            </label>
          </div>

          <label>Режим ипотеки (mortgage_mode)
            <select id="mortgage_mode">
              <option value="none" selected>без ипотеки</option>
              <option value="fixed_term">на фиксированный срок</option>
              <option value="by_budget">по ежемесячному бюджету</option>
            </select>
          </label>

          <div id="mortgage_common" style="display:none; margin-top:12px;">
            <label>Ставка по ипотеке, % годовых (ipotek_percent)
              <input id="ipotek_percent" type="number" step="0.5" value="18">
            </label>
          </div>

          <div id="mortgage_fixed_term" style="display:none; margin-top:12px;">
            <label>Срок ипотеки, лет (mortgage_term_years)
              <input id="mortgage_term_years" type="number" step="1" value="10">
            </label>
          </div>

          <div id="mortgage_budget" style="display:none; margin-top:12px;">
            <label>Бюджет платежа в месяц (mortgage_monthly_budget)
              <input id="mortgage_monthly_budget" type="number" step="1000" value="80000">
            </label>
          </div>

          <button id="btn">Посчитать</button>
          <div id="status" class="err"></div>
        </div>
      </div>

      <!-- RIGHT -->
      <div>
        <div id="right_placeholder" class="placeholder">
          <b>Заполните данные и нажмите «Посчитать».</b>
          <div style="margin-top:8px;">Здесь появятся итоги и таблица по месяцам входа.</div>
        </div>

        <div id="right_results" style="display:none;">
          <div class="card">
            <h2 style="margin:0 0 12px;">Результаты</h2>

            <div class="row">
              <div class="metric">
                <b>Лучший месяц входа</b>
                <div id="best_month">—</div>
              </div>

              <div class="metric">
                <b>Итог: депозит</b>
                <div id="deposit_final">—</div>
              </div>

              <div class="metric">
                <b>Итог: покупка</b>
                <div id="buy_final">—</div>
              </div>

              <div class="metric">
                <b>Разница</b>
                <div id="diff_final">—</div>
              </div>
            </div>

            <div id="top_text" style="padding-top:19px; margin-top:12px; font-weight:700; border-top:1px solid #ddd;">—</div>
          </div>

          <div class="card">
            <h2 style="margin:0 0 12px;">Сценарии по месяцам входа</h2>
            <div class="tableWrap" id="results_table"></div>
          </div>
          <div class="card">
            <h2 style="margin:0 0 12px;">Детальные таблицы по каждому месяцу входа</h2>
            <div id="details_tables"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_CALC_URL = "/investment";
    const el = (id) => document.getElementById(id);

    function toggleMortgageBlocks() {
      const mode = el("mortgage_mode").value;
      el("mortgage_common").style.display = mode !== "none" ? "block" : "none";
      el("mortgage_fixed_term").style.display = mode === "fixed_term" ? "block" : "none";
      el("mortgage_budget").style.display = mode === "by_budget" ? "block" : "none";
    }

    function toggleDepositBlocks() {
      const depositMode = el("deposit_mode").value;
      el("deposit_common").style.display = depositMode !== "none" ? "block" : "none";
    }

    function toggleNewBuildingBlocks() {
      const newBuildingMode = el("new_building_mode").value;
      el("new_building_common").style.display = newBuildingMode === "yes" ? "block" : "none";
    }

    function showResultsRightPanel() {
      el("right_placeholder").style.display = "none";
      el("right_results").style.display = "block";
    }

    function formatMoney(v) {
      return Number(v).toLocaleString("ru-RU", {
        maximumFractionDigits: 0
      });
    }

    function buildTableHtml(headers, rows) {
      let html = "<table><thead><tr>";
      for (const h of headers) html += `<th>${h}</th>`;
      html += "</tr></thead><tbody>";

      for (const r of rows) {
        html += "<tr>";
        for (const cell of r) html += `<td>${cell}</td>`;
        html += "</tr>";
      }

      html += "</tbody></table>";
      return html;
    }

    function buildTable(containerId, headers, rows) {
      const c = el(containerId);
      c.innerHTML = buildTableHtml(headers, rows);
    }

    function buildScenarioDetails(results) {
      const container = el("details_tables");

      if (!results || results.length === 0) {
        container.innerHTML = "<div class='small'>Нет данных для детальных таблиц.</div>";
        return;
      }

      let html = "";

      for (const item of results) {
        const summary = `
          Вход в месяц ${item.start_month}
          — стартовый капитал ${formatMoney(item.start_capital)}
          — цена объекта ${formatMoney(item.start_price)}
          — итоговый капитал ${formatMoney(item.final_net_worth)}
        `;

        const rows = (item.schedule || []).map(r => [
          r.month_from_start,
          r.calendar_month,
          formatMoney(r.mortgage_payment),
          formatMoney(r.interest_paid),
          formatMoney(r.principal_paid),
          formatMoney(r.loan_balance),
          formatMoney(r.buy_balance_change),
          formatMoney(r.paid_apart_part),
          formatMoney(r.buy_balance),
          formatMoney(r.apart_price),
          formatMoney(r.net_worth_buy),
        ]);

        const tableHtml = buildTableHtml(
          [
            "Месяц от входа",
            "Календарный месяц",
            "Платёж по ипотеке",
            "Проценты банку",
            "Погашение тела",
            "Остаток долга",
            "Изменение общего капитала",
            "Капитал в объекте",
            "Денежный баланс",
            "Рыночная цена объекта",
            "Итоговый капитал"
          ],
          rows
        );

        html += `
          <details>
            <summary>${summary}</summary>
            <div class="small">
              Осталось месяцев до конца расчета: ${item.months_left},
              общий платёж по ипотеке: ${formatMoney(item.total_mortgage_paid)},
              остаток долга в конце: ${formatMoney(item.loan_left)}
            </div>
            <div class="tableWrap" style="margin-top:10px;">
              ${tableHtml}
            </div>
          </details>
        `;
      }

      container.innerHTML = html;
    }



    function buildPayload() {
      const depositMode = el("deposit_mode").value;
      const mortgageMode = el("mortgage_mode").value;
      const newBuildingMode = el("new_building_mode").value;

      return {
        years_of_calculation: Number(el("years_of_calculation").value),
        all_free_money: Number(el("all_free_money").value),
        invest_percent: Number(el("invest_percent").value),

        deposit_refill: depositMode,
        deposit_refill_amount:
          depositMode !== "none"
            ? Number(el("deposit_refill_amount").value)
            : null,

        purchase_price: Number(el("purchase_price").value),
        yearly_apart_price_change: Number(el("yearly_apart_price_change").value),

        new_building: newBuildingMode,
        year_new_building_ready:
          newBuildingMode === "yes"
            ? Number(el("year_new_building_ready").value)
            : null,

        new_building_price_change:
          newBuildingMode === "yes"
            ? Number(el("new_building_price_change").value)
            : null,

        mortgage_mode: mortgageMode,
        ipotek_percent:
          mortgageMode !== "none"
            ? Number(el("ipotek_percent").value)
            : null,

        mortgage_term_years:
          mortgageMode === "fixed_term"
            ? Number(el("mortgage_term_years").value)
            : null,

        mortgage_monthly_budget:
          mortgageMode === "by_budget"
            ? Number(el("mortgage_monthly_budget").value)
            : null,

        k_min: 0
      };
    }

    async function fetchJson(url, payload) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        const text = await res.text();
        throw new Error(`API error ${res.status}: ${text}`);
      }

      return await res.json();
    }

    function showResult(data) {
      showResultsRightPanel();

      el("best_month").textContent = data.best_month ?? "—";
      el("deposit_final").textContent = formatMoney(data.deposit_final ?? 0);
      el("buy_final").textContent = formatMoney(data.best_buy_final ?? 0);
      el("diff_final").textContent = formatMoney(data.difference_final ?? 0);
      el("top_text").textContent = String(data.message || "—");

      buildTable(
        "results_table",
        [
          "Месяц входа",
          "Стартовый капитал",
          "Цена объекта",
          "Месяцев до конца",
          "Платёж по ипотеке",
          "Всего выплачено по ипотеке",
          "Остаток долга",
          "Денежный баланс",
          "Итоговый капитал"
        ],
        data.results.map(r => [
          r.start_month,
          formatMoney(r.start_capital),
          formatMoney(r.start_price),
          r.months_left,
          formatMoney(r.mortgage_payment),
          formatMoney(r.total_mortgage_paid),
          formatMoney(r.loan_left),
          formatMoney(r.buy_balance),
          formatMoney(r.final_net_worth),
        ])
      );

      buildScenarioDetails(data.results);
    }

    async function calculate() {
      el("status").textContent = "";

      try {
        const payload = buildPayload();
        const data = await fetchJson(API_CALC_URL, payload);
        showResult(data);
      } catch (error) {
        el("status").textContent = "Ошибка: " + error.message;
      }
    }

    el("mortgage_mode").addEventListener("change", toggleMortgageBlocks);
    el("deposit_mode").addEventListener("change", toggleDepositBlocks);
    el("new_building_mode").addEventListener("change", toggleNewBuildingBlocks);
    el("btn").addEventListener("click", calculate);

    toggleMortgageBlocks();
    toggleDepositBlocks();
    toggleNewBuildingBlocks();
  </script>
</body>
</html>
