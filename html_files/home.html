<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Калькуляторы</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 40px 16px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 20px; }
    .btn {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 0;
      background: #111;
      color: #fff;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div>Выберите калькулятор, чтобы сравнить покупку и аренду квартиры.</div>
      <a class="btn" href="/calc">Открыть калькулятор для жизни</a>
      <a class="btn" href="/investment">Открыть калькулятор для инвестиции</a>
    </div>
  </div>
</body>
</html>
